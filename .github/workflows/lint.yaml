name: Run lint
on: [push, pull_request]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
